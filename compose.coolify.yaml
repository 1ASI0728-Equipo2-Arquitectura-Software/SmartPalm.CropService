services:
  crop-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CropDatabase: Host=${CROP_DB_HOST};Port=${CROP_DB_PORT_REMOTE:-5432};Database=${CROP_DB_NAME:-smartpalm_crop};Username=${CROP_DB_USERNAME};Password=${CROP_DB_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER:-smartpalm.identity}
      Jwt__Audience: ${JWT_AUDIENCE:-smartpalm.clients}
      Jwt__Key: ${JWT_KEY}
      RabbitMq__Enabled: ${RABBITMQ_ENABLED:-true}
      RabbitMq__Uri: ${RABBITMQ_URI}
      RabbitMq__Exchange: ${RABBITMQ_EXCHANGE:-smartpalm.events}
    ports:
      - "${CROP_API_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
