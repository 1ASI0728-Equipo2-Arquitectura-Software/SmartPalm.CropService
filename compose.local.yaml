services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartpalm_crop
      POSTGRES_USER: smartpalm_crop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${CROP_DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpalm_crop -d smartpalm_crop"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - crop-postgres:/var/lib/postgresql/data

  crop-api:
    build:
      context: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CropDatabase: Host=postgres;Port=5432;Database=smartpalm_crop;Username=smartpalm_crop;Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: smartpalm.identity
      Jwt__Audience: smartpalm.clients
      Jwt__Key: ${JWT_KEY}
      RabbitMq__Enabled: ${RABBITMQ_ENABLED:-false}
      RabbitMq__Uri: ${RABBITMQ_URI:-amqp://guest:guest@rabbitmq:5672/}
    ports:
      - "${CROP_API_PORT:-5102}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: ["messaging"]
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  crop-postgres:
